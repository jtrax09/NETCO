services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: netco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: netco
    volumes:
      - netco_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netco -d netco"]
      interval: 10s
      timeout: 5s
      retries: 5

  netco-app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://netco:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/netco?schema=public
      ROUTER_ENCRYPTION_KEY: ${ROUTER_ENCRYPTION_KEY}
      ADMIN_INITIAL_PASSCODE: ${ADMIN_INITIAL_PASSCODE}
      MPESA_API_KEY: ${MPESA_API_KEY:-}
      MPESA_PUBLIC_KEY: ${MPESA_PUBLIC_KEY:-}
      MPESA_SERVICE_PROVIDER_CODE: ${MPESA_SERVICE_PROVIDER_CODE:-}
      MPESA_WEBHOOK_SECRET: ${MPESA_WEBHOOK_SECRET:-}
      AIRTEL_CLIENT_ID: ${AIRTEL_CLIENT_ID:-}
      AIRTEL_CLIENT_SECRET: ${AIRTEL_CLIENT_SECRET:-}
      AIRTEL_WEBHOOK_SECRET: ${AIRTEL_WEBHOOK_SECRET:-}
      TIGO_CLIENT_ID: ${TIGO_CLIENT_ID:-}
      TIGO_CLIENT_SECRET: ${TIGO_CLIENT_SECRET:-}
      TIGO_BILLER_CODE: ${TIGO_BILLER_CODE:-}
      TIGO_WEBHOOK_SECRET: ${TIGO_WEBHOOK_SECRET:-}
      HALOPESA_MERCHANT_CODE: ${HALOPESA_MERCHANT_CODE:-}
      HALOPESA_API_SECRET: ${HALOPESA_API_SECRET:-}
      HALOPESA_WEBHOOK_SECRET: ${HALOPESA_WEBHOOK_SECRET:-}
    volumes:
      - netco_sqlite_data:/app/data

volumes:
  netco_pg_data:
  netco_sqlite_data:
