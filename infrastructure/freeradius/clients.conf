# TRAX LINK — FreeRADIUS NAS Client Configuration (WireGuard Private Subnet Only)
# Never allow 0.0.0.0/0 public RADIUS clients; restrict to WireGuard tunnel CIDR.

client traxlink-wireguard-subnet {
    ipaddr = 10.66.0.0/16
    secret = ${RADIUS_SHARED_SECRET}
    nas_type = mikrotik
    shortname = traxlink-routers
    require_message_authenticator = yes
}
