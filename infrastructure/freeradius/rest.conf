# TRAX LINK — FreeRADIUS REST / SQL Authorization & Accounting Integration
# Configure rlm_rest in FreeRADIUS to call the TRAX LINK backend securely over private network.

rest {
    tls {
        check_cert = yes
    }
    authorize {
        uri = "${TRAX_API_INTERNAL_URL}/api/radius/authorize"
        method = 'post'
        body = 'json'
        data = '{"username":"%{User-Name}","password":"%{User-Password}","nasIp":"%{NAS-IP-Address}","callingStationId":"%{Calling-Station-Id}"}'
        headers {
            X-Radius-Secret = "${RADIUS_SHARED_SECRET}"
        }
    }
    accounting {
        uri = "${TRAX_API_INTERNAL_URL}/api/radius/accounting"
        method = 'post'
        body = 'json'
        data = '{"acctSessionId":"%{Acct-Session-Id}","username":"%{User-Name}","statusType":"%{Acct-Status-Type}","nasIp":"%{NAS-IP-Address}","framedIp":"%{Framed-IP-Address}","sessionTime":%{%{Acct-Session-Time}:-0},"inputOctets":%{%{Acct-Input-Octets}:-0},"outputOctets":%{%{Acct-Output-Octets}:-0},"terminateCause":"%{Acct-Terminate-Cause}"}'
        headers {
            X-Radius-Secret = "${RADIUS_SHARED_SECRET}"
        }
    }
}
